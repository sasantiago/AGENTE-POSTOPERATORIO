<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Llamada — Agente postoperatorio</title>
<link rel="stylesheet" href="/webui/static/shared.css" />
<style>
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 120% at 50% 0%, #1e2b28 0%, #12181a 60%, #0b0f10 100%);
    color: #eef3ef;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 2rem 1.2rem;
  }

  .encabezado {
    width: 100%;
    max-width: 640px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .marca { font-weight: 600; letter-spacing: 0.02em; opacity: 0.85; font-size: 0.95rem; }

  #panel-config {
    width: 100%;
    max-width: 420px;
    padding: 1.4rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }
  #panel-config h2 { margin: 0 0 0.2rem; font-size: 1.05rem; color: var(--ink); }
  #panel-config label { font-size: 0.8rem; color: var(--ink-soft); }
  #panel-config input, #panel-config select {
    width: 100%; padding: 0.55rem 0.7rem; border-radius: 10px; border: 1px solid #d8d3c6;
    font-size: 0.95rem; font-family: inherit;
  }
  #panel-config button {
    margin-top: 0.4rem; padding: 0.7rem; border: none; border-radius: 12px;
    background: var(--sage-deep); color: white; font-weight: 600; font-size: 0.95rem;
  }

  #escenario { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
  #orbe-contenedor { width: min(60vw, 320px); height: min(60vw, 320px); }
  #estado-texto { margin-top: 0.6rem; font-size: 0.95rem; opacity: 0.75; letter-spacing: 0.02em; min-height: 1.4em; }

  #criticidad-flotante { position: absolute; top: 1.6rem; right: 1.6rem; }

  #transcripcion {
    width: 100%;
    max-width: 640px;
    max-height: 22vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    padding: 0 0.4rem;
    font-size: 0.88rem;
  }
  .turno { padding: 0.5rem 0.8rem; border-radius: 12px; max-width: 85%; line-height: 1.4; }
  .turno-paciente { align-self: flex-end; background: rgba(159, 214, 184, 0.16); }
  .turno-agente { align-self: flex-start; background: rgba(255, 255, 255, 0.06); }

  #controles {
    width: 100%;
    max-width: 640px;
    display: flex;
    justify-content: center;
    padding-top: 0.8rem;
  }
  #boton-hablar {
    width: 78px; height: 78px; border-radius: 50%; border: none;
    background: linear-gradient(160deg, #9fd6b8, #4f8a70);
    box-shadow: 0 6px 24px rgba(111, 169, 138, 0.35);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #boton-hablar:active, #boton-hablar.grabando {
    transform: scale(1.08);
    box-shadow: 0 8px 32px rgba(111, 169, 138, 0.55);
  }
  #boton-hablar:disabled { opacity: 0.4; }
  #boton-hablar svg { width: 28px; height: 28px; fill: white; }

  .oculto { display: none !important; }
</style>
</head>
<body>

<div class="encabezado">
  <span class="marca">Seguimiento postoperatorio</span>
  <span id="criticidad-badge" class="badge badge-verde oculto"><span class="badge-dot"></span><span id="criticidad-texto">verde</span></span>
</div>

<div id="panel-config" class="glass-card">
  <h2>Antes de empezar</h2>
  <label>Nombre o ID del paciente</label>
  <input id="input-paciente" type="text" value="Don Ramiro" />
  <label>Procedimiento</label>
  <select id="input-procedimiento">
    <option>Apendicectomía</option>
    <option>Colecistectomía</option>
    <option>Colectomía</option>
    <option>Reemplazo de cadera/rodilla</option>
    <option>Mastectomía</option>
  </select>
  <label>Día postoperatorio</label>
  <select id="input-dia">
    <option value="1">1</option>
    <option value="3" selected>3</option>
    <option value="7">7</option>
    <option value="14">14</option>
  </select>
  <button id="boton-iniciar">Iniciar llamada</button>
</div>

<div id="escenario" class="oculto">
  <div id="orbe-contenedor"></div>
  <div id="estado-texto">Toca el micrófono para hablar</div>
</div>

<div id="transcripcion" class="oculto"></div>

<div id="controles" class="oculto">
  <button id="boton-hablar" disabled>
    <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V5a3 3 0 10-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z"/></svg>
  </button>
</div>

<script type="module" src="/webui/static/llamada.js"></script>
</body>
</html>
