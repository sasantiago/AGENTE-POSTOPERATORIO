<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Consola — Agente postoperatorio</title>
<link rel="stylesheet" href="/webui/static/shared.css" />
<style>
  body {
    background: linear-gradient(180deg, var(--cream) 0%, var(--cream-deep) 100%);
    min-height: 100vh;
  }
  .envoltorio { max-width: 920px; margin: 0 auto; padding: 2.2rem 1.4rem 4rem; }

  .encabezado { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
  #orbe-mini { width: 56px; height: 56px; flex-shrink: 0; }
  .encabezado h1 { font-size: 1.25rem; margin: 0; }
  .encabezado p { margin: 0.15rem 0 0; color: var(--ink-soft); font-size: 0.88rem; }

  section.tarjeta { padding: 1.5rem 1.6rem; margin-bottom: 1.4rem; }
  section.tarjeta h2 { margin: 0 0 1rem; font-size: 1.02rem; }

  #form-subida { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
  #form-subida input[type="text"], #form-subida input[type="file"] {
    padding: 0.55rem 0.8rem; border-radius: 10px; border: 1px solid #d8d3c6;
    font-family: inherit; font-size: 0.9rem; background: white;
  }
  #form-subida button, #btn-refrescar, #btn-inspeccionar {
    padding: 0.6rem 1.1rem; border: none; border-radius: 10px;
    background: var(--sage-deep); color: white; font-weight: 600; font-size: 0.88rem;
  }
  #btn-refrescar { background: transparent; color: var(--sage-deep); border: 1px solid var(--sage-soft); margin-bottom: 0.9rem; }
  #estado-subida { font-size: 0.85rem; color: var(--ink-soft); margin: 0.6rem 0 0; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); padding: 0.4rem 0.5rem; }
  td { padding: 0.55rem 0.5rem; border-top: 1px solid rgba(0,0,0,0.06); font-size: 0.87rem; }
  .btn-eliminar { background: none; border: none; color: #a3492f; font-size: 0.82rem; font-weight: 600; padding: 0.3rem 0.6rem; border-radius: 8px; }
  .btn-eliminar:hover { background: rgba(224, 120, 95, 0.12); }

  #consulta-inspector {
    width: 65%; padding: 0.6rem 0.9rem; border-radius: 10px; border: 1px solid #d8d3c6;
    font-family: inherit; font-size: 0.9rem;
  }
  .chunk { background: rgba(255,255,255,0.6); padding: 0.7rem 0.9rem; margin: 0.5rem 0; border-radius: 12px; font-size: 0.85rem; line-height: 1.5; border: 1px solid rgba(0,0,0,0.04); }
  .chunk strong { color: var(--sage-deep); }
</style>
</head>
<body>
<div class="envoltorio">

  <div class="encabezado">
    <div id="orbe-mini"></div>
    <div>
      <h1>Consola de administración</h1>
      <p>Conocimiento clínico — subir, listar, eliminar, inspeccionar</p>
    </div>
  </div>

  <section class="tarjeta glass-card">
    <h2>Subir documento</h2>
    <form id="form-subida">
      <input type="file" id="archivo" required />
      <input type="text" id="procedimiento" placeholder="procedimiento (opcional)" />
      <button type="submit">Subir e indexar</button>
    </form>
    <p id="estado-subida"></p>
  </section>

  <section class="tarjeta glass-card">
    <h2>Documentos indexados</h2>
    <button id="btn-refrescar">Refrescar</button>
    <table>
      <thead><tr><th>Documento</th><th>Procedimiento</th><th>Chunks</th><th>Versión</th><th></th></tr></thead>
      <tbody id="tabla-documentos"></tbody>
    </table>
  </section>

  <section class="tarjeta glass-card">
    <h2>Inspector — ¿qué sabe el agente sobre X?</h2>
    <input type="text" id="consulta-inspector" placeholder="Escribe una pregunta clínica..." />
    <button id="btn-inspeccionar">Consultar</button>
    <div id="resultados-inspector"></div>
  </section>

</div>

<script type="module">
import { Orb } from "/webui/static/orb.js";
const orbeMini = new Orb(document.getElementById("orbe-mini"));
orbeMini.setState("idle");
</script>

<script>
async function refrescarDocumentos() {
  const res = await fetch('/api/consola/documentos');
  const data = await res.json();
  const tbody = document.getElementById('tabla-documentos');
  tbody.innerHTML = '';
  for (const doc of data.documentos) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${doc.documento}</td><td>${doc.procedimiento}</td><td>${doc.n_chunks}</td><td>${doc.version}</td>
      <td><button data-doc="${doc.documento}" class="btn-eliminar">Eliminar</button></td>`;
    tbody.appendChild(tr);
  }
  document.querySelectorAll('.btn-eliminar').forEach(btn => {
    btn.addEventListener('click', async () => {
      await fetch(`/api/consola/documentos/${encodeURIComponent(btn.dataset.doc)}`, { method: 'DELETE' });
      refrescarDocumentos();
    });
  });
}

document.getElementById('btn-refrescar').addEventListener('click', refrescarDocumentos);

document.getElementById('form-subida').addEventListener('submit', async (e) => {
  e.preventDefault();
  const archivo = document.getElementById('archivo').files[0];
  const procedimiento = document.getElementById('procedimiento').value || 'general';
  const formData = new FormData();
  formData.append('archivo', archivo);

  const estado = document.getElementById('estado-subida');
  estado.textContent = 'Procesando (extracción de texto + embeddings)...';

  const res = await fetch(`/api/consola/documentos?procedimiento=${encodeURIComponent(procedimiento)}`, {
    method: 'POST',
    body: formData,
  });
  const data = await res.json();
  estado.textContent = res.ok
    ? `${data.documento} · ${data.n_chunks} chunks · ${data.estado}`
    : `Error: ${data.detail}`;
  refrescarDocumentos();
});

document.getElementById('btn-inspeccionar').addEventListener('click', async () => {
  const consulta = document.getElementById('consulta-inspector').value;
  if (!consulta) return;
  const res = await fetch(`/api/consola/inspector?consulta=${encodeURIComponent(consulta)}`);
  const data = await res.json();
  const div = document.getElementById('resultados-inspector');
  div.innerHTML = data.resultados.length
    ? data.resultados.map(r => `<div class="chunk"><strong>${r.documento}</strong> (${r.chunk_id}, relevancia=${r.relevancia.toFixed(3)})<br>${r.texto.slice(0, 300)}...</div>`).join('')
    : '<p>Sin resultados — el agente no tiene información sobre eso.</p>';
});

refrescarDocumentos();
</script>
</body>
</html>
