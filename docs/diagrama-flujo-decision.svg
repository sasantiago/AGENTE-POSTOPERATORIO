<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-label="Flujo de decision por turno: el texto del paciente se evalua en paralelo por un reflejo de reglas deterministas y por el cortex (RAG mas LLM); la fusion toma la criticidad mas severa de las dos, el reflejo puede subir la criticidad pero nunca bajarla; el validador de citas descarta cualquier afirmacion clinica sin chunk_id verificable en ChromaDB y la reemplaza por un mensaje honesto; si la criticidad final es amarilla o roja se arma un SBAR de escalamiento, aunque ese modulo todavia no esta conectado al flujo en vivo.">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"></path>
    </marker>
  </defs>
  <style>
    svg { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    text { fill: #1e293b; }
    .box { fill: #f8fafc; stroke: #1e293b; stroke-width: 1.5; }
    .box-em { fill: #eef2ff; stroke: #4338ca; stroke-width: 2.5; }
    .box-pending { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .lbl { font-size: 15px; font-weight: 700; }
    .lbl-sm { font-size: 12px; fill: #475569; }
    .note { font-size: 11px; fill: #64748b; font-style: italic; }
    line, polyline { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow2); }
    .arrowhead { fill: #334155; }
    .edge-lbl { font-size: 12px; fill: #334155; }
    .edge-bg { fill: #fdfdfd; opacity: 0.9; }
    .veto { stroke: #b91c1c; }
    .veto-fill { fill: #b91c1c; }
    .pill { fill: #f1f5f9; stroke: #334155; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .box { fill: #1e293b; stroke: #cbd5e1; }
      .box-em { fill: #312e81; stroke: #a5b4fc; }
      .box-pending { fill: #1e293b; stroke: #64748b; }
      .lbl-sm { fill: #94a3b8; }
      .note { fill: #94a3b8; }
      line, polyline { stroke: #cbd5e1; }
      .arrowhead { fill: #cbd5e1; }
      .edge-lbl { fill: #cbd5e1; }
      .edge-bg { fill: #0b1220; opacity: 0.85; }
      .veto { stroke: #f87171; }
      .veto-fill { fill: #f87171; }
      .pill { fill: #0f172a; stroke: #cbd5e1; }
    }
  </style>

  <rect x="480" y="20" width="240" height="50" rx="25" class="pill"></rect>
  <text x="600" y="50" text-anchor="middle" class="lbl">texto_paciente (turno actual)</text>

  <line x1="540" y1="70" x2="330" y2="129" class="e"></line>
  <line x1="660" y1="70" x2="870" y2="129" class="e"></line>
  <rect x="380" y="88" width="90" height="16" class="edge-bg"></rect>
  <text x="425" y="100" text-anchor="middle" class="edge-lbl" font-size="11">en paralelo</text>
  <rect x="730" y="88" width="90" height="16" class="edge-bg"></rect>
  <text x="775" y="100" text-anchor="middle" class="edge-lbl" font-size="11">en paralelo</text>

  <rect x="120" y="130" width="340" height="90" rx="10" class="box"></rect>
  <text x="290" y="160" text-anchor="middle" class="lbl">Reflejo</text>
  <text x="290" y="180" text-anchor="middle" class="lbl-sm">reglas deterministas + umbral de fiebre</text>
  <text x="290" y="198" text-anchor="middle" class="lbl-sm">~5ms, sin LLM</text>

  <rect x="740" y="130" width="340" height="90" rx="10" class="box"></rect>
  <text x="910" y="160" text-anchor="middle" class="lbl">Cortex</text>
  <text x="910" y="180" text-anchor="middle" class="lbl-sm">RAG (4 chunks) + Llama 3.3 70B</text>
  <text x="910" y="198" text-anchor="middle" class="lbl-sm">JSON forzado (response_format)</text>

  <line x1="290" y1="220" x2="450" y2="278" class="e veto"></line>
  <rect x="230" y="238" width="210" height="16" class="edge-bg"></rect>
  <text x="335" y="250" text-anchor="middle" class="edge-lbl veto-note" fill="#b91c1c" font-size="11">criticidad_forzada — solo si dispara</text>

  <line x1="910" y1="220" x2="750" y2="278" class="e"></line>
  <rect x="700" y="238" width="190" height="16" class="edge-bg"></rect>
  <text x="795" y="250" text-anchor="middle" class="edge-lbl" font-size="11">criticidad_propuesta</text>

  <rect x="430" y="280" width="340" height="80" rx="10" class="box-em"></rect>
  <text x="600" y="308" text-anchor="middle" class="lbl">Fusión</text>
  <text x="600" y="326" text-anchor="middle" class="lbl-sm">criticidad_final = max(reflejo, cortex)</text>
  <text x="600" y="344" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="700">el reflejo puede vetar (subir) — nunca puede bajar</text>

  <line x1="600" y1="360" x2="600" y2="399" class="e"></line>

  <rect x="430" y="400" width="340" height="80" rx="10" class="box"></rect>
  <text x="600" y="428" text-anchor="middle" class="lbl">Validador de citas</text>
  <text x="600" y="446" text-anchor="middle" class="lbl-sm">toda afirmación clínica necesita chunk_id</text>
  <text x="600" y="464" text-anchor="middle" class="lbl-sm">verificable en ChromaDB</text>

  <line x1="480" y1="480" x2="330" y2="529" class="e"></line>
  <rect x="270" y="495" width="190" height="16" class="edge-bg"></rect>
  <text x="365" y="507" text-anchor="middle" class="edge-lbl" font-size="11">cita inválida o ausente</text>

  <line x1="720" y1="480" x2="720" y2="529" class="e"></line>
  <rect x="640" y="495" width="200" height="16" class="edge-bg"></rect>
  <text x="740" y="507" text-anchor="middle" class="edge-lbl" font-size="11">todas las citas verifican</text>

  <rect x="140" y="530" width="380" height="70" rx="10" class="box"></rect>
  <text x="330" y="558" text-anchor="middle" class="lbl">Fallback honesto</text>
  <text x="330" y="576" text-anchor="middle" class="lbl-sm">respuesta completa descartada — se avisa que</text>
  <text x="330" y="592" text-anchor="middle" class="lbl-sm">se escala a personal médico</text>

  <rect x="590" y="530" width="260" height="70" rx="10" class="box"></rect>
  <text x="720" y="558" text-anchor="middle" class="lbl">respuesta_hablada</text>
  <text x="720" y="576" text-anchor="middle" class="lbl-sm">→ TTS (Fig. 1)</text>

  <!-- SBAR, derivado de Fusión, no conectado -->
  <line x1="770" y1="310" x2="909" y2="310" class="e"></line>
  <polyline points="909,310 950,310 950,439 941,439" class="e"></polyline>
  <rect x="890" y="245" width="130" height="16" class="edge-bg"></rect>
  <text x="955" y="257" text-anchor="middle" class="edge-lbl" font-size="11">si amarillo/rojo</text>

  <rect x="940" y="400" width="240" height="80" rx="10" class="box-pending"></rect>
  <text x="1060" y="426" text-anchor="middle" class="lbl">SBAR de escalamiento</text>
  <text x="1060" y="444" text-anchor="middle" class="lbl-sm">situación · contexto · evaluación</text>
  <text x="1060" y="462" text-anchor="middle" class="lbl-sm" font-weight="700">construido, aún no conectado al loop en vivo</text>

  <text x="600" y="638" text-anchor="middle" class="note">
    clinical/sbar.py define construir_sbar() pero turn_manager.py todavía no lo invoca — pendiente de integración antes del video/demo.
  </text>
</svg>
